<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="../index.css"/>
    <link rel="stylesheet" href="server.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://unpkg.com/tippy.js@6.3.7/themes/light.css" rel="stylesheet">
    <link href="https://unpkg.com/tippy.js@6.3.7/themes/material.css" rel="stylesheet">
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
</head>
<body>
    <div class="container-sm">
        <div class="row mt-2">
            <h1>Server Manager</h1>
        </div>

        <div class="row mt-2">
            <div class="col-md-4">
                <div class="form-floating">
                    <input type="number" class="form-control" id="serverPort" min="0" placeholder="3000">
                    <label for="serverPort">Port</label>
                </div>
            </div>

            <div class="col-md-8">
                <button id="serverStartBtn" class="btn btn-success btn-lg mt-1" disabled>Start</button>
                <button id="serverStopBtn" class="btn btn-danger btn-lg mt-1" disabled>Stop</button>
                <div class="float-end">
                    <button id="clearLogsBtn" class="btn btn-primary btn-lg mt-1">Clear Logs</button>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-12">
                <textarea class="form-control serverLogs bg-dark text-light" style="min-height: 150px;" disabled></textarea>
            </div>
        </div>
    </div>

    <script src="./serverRenderer.js"></script>
</body>
</html>
